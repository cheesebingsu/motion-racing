<!doctype html>
<!--
  손 동작(웹캠)으로 조종하는 엔드리스 레이싱 게임.
  주의: 웹캠(getUserMedia)은 보안 컨텍스트에서만 동작합니다.
  반드시 https:// 또는 http://localhost 로 열어야 카메라 권한을 요청할 수 있습니다.
  (파일을 file:// 로 직접 열면 카메라가 동작하지 않습니다.)
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>모션 레이싱 · Motion Racing</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Three.js (real 3D) — import map so game3d.js can `import 'three'` -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <h1 class="app__title">모션 레이싱</h1>
    <p class="app__subtitle">양손으로 핸들을 잡고 기울여 조종하세요</p>

    <!-- .stage: relative wrapper; canvas + overlays stack here -->
    <div class="stage" id="stage">
      <canvas id="game-canvas" width="960" height="540" class="stage__canvas"></canvas>

      <!-- HUD overlay -->
      <div id="hud" class="hud">
        <div class="hud__row hud__row--top">
          <div class="hud__group">
            <span id="hud-score" class="hud__score">거리: 0 m</span>
            <span id="hud-speed" class="hud__speed">속도: 0 km/h</span>
          </div>
          <span id="hud-lives" class="hud__lives">❤❤❤</span>
        </div>
        <div class="hud__row hud__row--bottom">
          <button id="menu-btn" class="btn btn--ghost hud__menu">⏸ 메뉴</button>
        </div>
      </div>

      <!-- Mirrored webcam preview + hand-skeleton overlay (drawn by hand-tracking.js) -->
      <video id="cam" class="cam" autoplay playsinline muted></video>
      <canvas id="cam-overlay" class="cam-overlay" aria-hidden="true"></canvas>

      <!-- Cockpit steering wheel (real supercar wheel image; only the top shows) -->
      <img id="wheel" class="wheel" src="assets/wheel.png" alt="" aria-hidden="true" />

      <!-- 3D overlays (countdown / pause) drawn as DOM over the WebGL canvas -->
      <div id="countdown3d" class="cd3d" hidden></div>
      <div id="pause3d" class="pause3d" hidden>
        <div class="pause3d__title">⏸ 일시정지</div>
        <div class="pause3d__sub">양손을 화면에 보여주면 이어서 시작해요</div>
      </div>

      <!-- Status line -->
      <div id="status" class="status"></div>

      <!-- Start screen -->
      <div id="start-screen" class="screen screen--start">
        <div class="screen__panel wizard">
          <h2 class="screen__title">모션 레이싱</h2>

          <!-- Step 1: vehicle -->
          <div class="wstep" data-step="1">
            <div class="wstep__label">① 차량 선택</div>
            <div id="vehicle-grid" class="pickgrid"></div>
            <div class="wstep__nav">
              <button class="btn btn--primary" data-next="2">다음 ▸</button>
            </div>
          </div>

          <!-- Step 2: map/city -->
          <div class="wstep" data-step="2" hidden>
            <div class="wstep__label">② 맵 선택</div>
            <div id="map-grid" class="pickgrid"></div>
            <div class="wstep__nav">
              <button class="btn btn--ghost" data-back="1">◂ 뒤로</button>
              <button class="btn btn--primary" data-next="3">다음 ▸</button>
            </div>
          </div>

          <!-- Step 3: difficulty + settings + start -->
          <div class="wstep" data-step="3" hidden>
            <div class="wstep__label">③ 난이도 · 설정</div>
            <div class="difficulty" id="difficulty" role="group" aria-label="난이도 선택">
              <span class="difficulty__label">난이도</span>
              <div class="difficulty__opts">
                <button class="difficulty__btn" data-diff="easy">쉬움</button>
                <button class="difficulty__btn is-selected" data-diff="medium">중간</button>
                <button class="difficulty__btn" data-diff="hard">어려움</button>
              </div>
            </div>
            <div class="difficulty" id="viewsel" role="group" aria-label="시점 선택">
              <span class="difficulty__label">시점</span>
              <div class="difficulty__opts">
                <button class="difficulty__btn is-selected" data-view="3rd">3인칭</button>
                <button class="difficulty__btn" data-view="1st">1인칭 (운전석)</button>
              </div>
            </div>
            <div class="setting">
              <label class="setting__label" for="sensitivity">
                핸들 감도 <span id="sensitivity-val" class="setting__val">1.0×</span>
              </label>
              <input id="sensitivity" class="setting__slider" type="range"
                     min="0.5" max="2" step="0.1" value="1" aria-label="핸들 감도" />
            </div>
            <p class="screen__tip">💡 양손으로 핸들을 잡고 기울여 조종 · 손이 안 잡히면 뒤로 앉아 두 손을 화면에</p>
            <p class="screen__note">웹캠 권한 필요 · localhost 또는 https 에서 실행</p>
            <div class="wstep__nav">
              <button class="btn btn--ghost" data-back="2">◂ 뒤로</button>
              <button id="start-btn" class="btn btn--primary">게임 시작</button>
            </div>
            <div class="screen__actions">
              <button id="practice-btn" class="btn btn--ghost">연습 모드 · 장애물 없음</button>
              <button id="fullscreen-btn" class="btn btn--ghost">⛶ 전체화면 (모바일 권장)</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Game over screen -->
      <div id="gameover-screen" class="screen screen--over" hidden>
        <div class="screen__panel">
          <h2 class="screen__title screen__title--over">게임 오버</h2>
          <p id="final-score" class="screen__final">거리: 0 m</p>
          <button id="restart-btn" class="btn btn--primary">다시 시작</button>
        </div>
      </div>
    </div>

    <p class="app__hint">손이 감지되지 않으면 화면에 양손을 보여주세요</p>
  </div>

  <!-- Shown only on phones held in portrait: prompt to rotate to landscape. -->
  <div class="rotate-hint" aria-hidden="true">
    <div class="rotate-hint__icon">📱↻</div>
    <p class="rotate-hint__text">가로로 눕혀서 플레이하세요</p>
  </div>

  <!-- Only the entry module is loaded; it imports the rest -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
